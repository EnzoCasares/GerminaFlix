<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações | CasaFlix</title>
  <link rel="stylesheet" href="configuracoes.css" />
</head>
<body>
  <div class="conteiner-configuracoes">
    <h2>Configurações da Conta</h2>
    
    <div class="secao-configuracao">
      <h3>Idioma</h3>
      <select class="selecao-idioma">
        <option value="pt">Português (Brasil)</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>
    
    <div class="secao-configuracao">
      <h3>Tema</h3>
      <div class="opcoes-tema">
        <label class="opcao-tema">
          <input type="radio" name="tema" value="escuro" checked>
          <span>Escuro</span>
        </label>
        <label class="opcao-tema">
          <input type="radio" name="tema" value="claro">
          <span>Claro</span>
        </label>
      </div>
    </div>
    
    <div class="secao-configuracao">
      <h3>Notificações</h3>
      <div class="opcoes-notificacao">
        <label class="opcao-notificacao">
          <input type="checkbox" checked>
          <span>Novos lançamentos</span>
        </label>
        <label class="opcao-notificacao">
          <input type="checkbox" checked>
          <span>Recomendações personalizadas</span>
        </label>
        <label class="opcao-notificacao">
          <input type="checkbox">
          <span>Notícias e atualizações</span>
        </label>
      </div>
    </div>
    
    <div class="secao-configuracao">
      <h3>Perfil</h3>
      <div class="botoes-perfil">
        <button class="botao-config">Alterar Foto</button>
        <button class="botao-config">Alterar Senha</button>
        <button class="botao-perigo">Excluir Conta</button>
      </div>
    </div>
    
    <div class="area-acoes">
      <button class="botao-principal">Salvar Alterações</button>
      <button class="botao-secundario">Cancelar</button>
    </div>

    <footer>
      <p>&copy; 2025 CasaFlix. Todos os direitos reservados.&reg;</p>
    </footer>
  </div>
</body>
</html>
